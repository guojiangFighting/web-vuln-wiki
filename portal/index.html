<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web 漏洞学习门户</title>
<style>
  :root {
    --bg:#0d1117; --panel:#161b22; --panel2:#1f2630; --border:#2d3642;
    --text:#e6edf3; --muted:#8b98a5; --accent:#4aa3ff; --good:#3fb950;
    --wiki:#58a6ff; --pb:#a371f7; --warn:#d29922;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif; height:100vh; display:flex; overflow:hidden; }

  /* ===== 侧边栏 ===== */
  aside { width:300px; min-width:300px; background:var(--panel); border-right:1px solid var(--border); display:flex; flex-direction:column; }
  .brand { padding:18px 16px 12px; border-bottom:1px solid var(--border); }
  .brand h1 { font-size:16px; }
  .brand .s { color:var(--muted); font-size:11px; margin-top:4px; line-height:1.5; }
  .searchbox { padding:10px 12px; border-bottom:1px solid var(--border); }
  .searchbox input { width:100%; background:var(--panel2); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:8px 12px; font-size:13px; outline:none; }
  .searchbox input:focus { border-color:var(--accent); }
  .searchbox .hint { color:var(--muted); font-size:10px; margin-top:5px; }
  nav { flex:1; overflow-y:auto; padding:6px 0 20px; }
  nav::-webkit-scrollbar { width:6px; } nav::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
  .wiki-block { margin-top:10px; }
  .wiki-title { padding:6px 16px; font-size:12px; font-weight:700; display:flex; align-items:center; gap:8px; }
  .wiki-title .dot { width:8px; height:8px; border-radius:50%; }
  .cat-title { padding:5px 16px 3px; font-size:11px; color:var(--muted); }
  a.nav-entry { display:flex; align-items:center; gap:7px; padding:5px 16px 5px 24px; color:var(--text); text-decoration:none; font-size:12.5px; border-left:2px solid transparent; }
  a.nav-entry:hover { background:var(--panel2); }
  a.nav-entry.active { background:var(--panel2); border-left-color:var(--accent); color:var(--accent); }
  a.nav-entry .read { color:var(--good); font-size:11px; margin-left:auto; }
  a.nav-entry .t { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* ===== 主区 ===== */
  main { flex:1; display:flex; flex-direction:column; overflow:hidden; }
  .topbar { padding:12px 26px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:14px; }
  .topbar .crumb { font-size:13px; color:var(--muted); }
  .topbar .crumb b { color:var(--text); }
  .topbar .spacer { flex:1; }
  .topbar a.btn, .topbar button.btn { background:var(--panel2); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:7px 14px; font-size:12.5px; cursor:pointer; text-decoration:none; }
  .topbar a.btn:hover, .topbar button.btn:hover { border-color:var(--accent); }
  .progress-line { height:3px; background:var(--panel2); }
  .progress-line > div { height:100%; background:var(--good); width:0%; transition:width .3s; }
  .content { flex:1; overflow-y:auto; padding:30px 0 80px; }
  .content::-webkit-scrollbar { width:8px; } .content::-webkit-scrollbar-thumb { background:var(--border); border-radius:4px; }
  .paper { max-width:820px; margin:0 auto; padding:0 34px; }

  /* 首页 */
  .home-hero { background:linear-gradient(135deg,#16202c,#12181f); border:1px solid var(--border); border-radius:14px; padding:26px 30px; margin-bottom:22px; }
  .home-hero h2 { font-size:20px; margin-bottom:10px; }
  .home-hero p { color:var(--muted); font-size:13.5px; line-height:1.8; }
  .stat-row { display:flex; gap:14px; margin-top:16px; flex-wrap:wrap; }
  .stat { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:12px 20px; text-align:center; }
  .stat .n { font-size:22px; font-weight:700; color:var(--accent); }
  .stat .l { font-size:11px; color:var(--muted); margin-top:3px; }
  .home-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .home-card { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:20px; cursor:pointer; transition:border-color .15s; }
  .home-card:hover { border-color:var(--accent); }
  .home-card h3 { font-size:15px; margin-bottom:8px; }
  .home-card p { color:var(--muted); font-size:12.5px; line-height:1.7; }
  .home-card .go { color:var(--accent); font-size:12px; margin-top:10px; display:inline-block; }

  /* 正文排版（人类阅读性核心） */
  .entry-head { margin-bottom:6px; }
  .entry-head .chip { display:inline-block; padding:3px 11px; border-radius:999px; font-size:11.5px; border:1px solid var(--border); color:var(--muted); margin-right:7px; margin-bottom:7px; }
  .entry-head .chip.c-wiki { color:var(--wiki); border-color:var(--wiki); }
  .entry-head .chip.c-pb { color:var(--pb); border-color:var(--pb); }
  .entry-head h1 { font-size:24px; line-height:1.5; margin:8px 0 14px; }
  .symptom-box { background:#141c26; border:1px solid var(--border); border-left:3px solid var(--warn); border-radius:8px; padding:11px 16px; font-size:12.5px; color:var(--muted); margin:14px 0; line-height:1.8; }
  .paper .md { font-size:14.5px; line-height:1.85; }
  .paper .md h2 { font-size:18px; margin:30px 0 12px; padding-top:14px; border-top:1px solid var(--border); }
  .paper .md h2:first-child { border-top:none; margin-top:8px; }
  .paper .md h3 { font-size:15.5px; margin:22px 0 10px; }
  .paper .md p { margin:10px 0; }
  .paper .md ul, .paper .md ol { margin:10px 0 10px 24px; }
  .paper .md li { margin:5px 0; }
  .paper .md blockquote { border-left:3px solid var(--accent); background:#131c28; margin:14px 0; padding:10px 18px; border-radius:0 8px 8px 0; color:#b8c7d6; }
  .paper .md blockquote p { margin:4px 0; }
  .paper .md code { background:var(--panel2); padding:2px 7px; border-radius:5px; font-size:13px; font-family:Consolas,"Cascadia Code",monospace; color:#79c0ff; }
  .paper .md pre { background:#10151c; border:1px solid var(--border); border-radius:10px; padding:16px 18px; overflow-x:auto; margin:14px 0; line-height:1.65; }
  .paper .md pre code { background:none; padding:0; color:#c9d9e8; font-size:12.8px; }
  .paper .md table { border-collapse:collapse; width:100%; margin:16px 0; font-size:13px; }
  .paper .md th { background:var(--panel2); text-align:left; padding:9px 13px; border:1px solid var(--border); font-weight:600; }
  .paper .md td { padding:9px 13px; border:1px solid var(--border); }
  .paper .md tr:nth-child(even) td { background:#131a22; }
  .paper .md a { color:var(--accent); text-decoration:none; border-bottom:1px dotted var(--accent); }
  .paper .md a:hover { border-bottom-style:solid; }
  .paper .md hr { border:none; border-top:1px solid var(--border); margin:24px 0; }
  .entry-footer { margin-top:36px; padding-top:18px; border-top:1px solid var(--border); display:flex; gap:10px; justify-content:space-between; align-items:center; }
  .entry-footer button { background:var(--panel2); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:8px 16px; font-size:12.5px; cursor:pointer; }
  .entry-footer button.mark { border-color:var(--good); color:var(--good); }
  .entry-footer button.mark.on { background:var(--good); color:#06130a; font-weight:600; }
  .nav-arrows { display:flex; gap:10px; }
  .empty { color:var(--muted); text-align:center; padding:80px 0; font-size:13px; }
  .search-hit { display:block; padding:10px 16px; border-left:2px solid transparent; color:var(--text); text-decoration:none; font-size:12.5px; }
  .search-hit:hover, .search-hit.active { background:var(--panel2); border-left-color:var(--accent); }
  .search-hit .snippet { color:var(--muted); font-size:11px; margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  mark { background:#31567d; color:#dbe9f7; border-radius:3px; padding:0 2px; }
</style>
</head>
<body>

<aside>
  <div class="brand">
    <h1>📚 Web 漏洞学习门户</h1>
    <div class="s">教科书（是什么）+ 实战手册（怎么打）+ 知识卡 · 一站式学习</div>
  </div>
  <div class="searchbox">
    <input id="q" type="text" placeholder="搜索：标题 / 症状 / 全文…">
    <div class="hint">支持全文检索，如「__proto__」「打不动」「sqlmap」</div>
  </div>
  <nav id="nav"></nav>
</aside>

<main>
  <div class="topbar">
    <span class="crumb" id="crumb">首页</span>
    <span class="spacer"></span>
    <a class="btn" href="../cards/viewer.html">🎴 知识卡（163）</a>
    <a class="btn" href="https://portswigger.net/web-security" target="_blank">🎯 PortSwigger Labs</a>
    <button class="btn" id="homeBtn">🏠 首页</button>
  </div>
  <div class="progress-line"><div id="pbar"></div></div>
  <div class="content"><div class="paper" id="view"></div></div>
</main>

<script src="content.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const LS_READ = "portal-read-v1";
  const read = new Set(JSON.parse(localStorage.getItem(LS_READ) || "[]"));

  // 扁平化条目
  const ALL = [];
  PORTAL_DATA.wikis.forEach(w => w.entries.forEach(e => ALL.push({ ...e, wiki: w.id, wikiName: w.name })));
  const byKey = new Map(ALL.map(e => [e.wiki + "/" + e.id, e]));

  function saveRead() { localStorage.setItem(LS_READ, JSON.stringify([...read])); }
  function esc(s) { return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
  function mark(e) { return read.has(e.wiki + "/" + e.id); }

  // ===== 侧边栏 =====
  function buildNav(filter) {
    const nav = $("nav"); nav.innerHTML = "";
    const f = (filter || "").toLowerCase();
    const total = ALL.length, done = ALL.filter(mark).length;
    $("pbar").style.width = (total ? done / total * 100 : 0) + "%";
    let html = `<div class="wiki-block"><div class="wiki-title" style="cursor:pointer" onclick="location.hash='#/home'">🏠 学习首页</div>
      <div class="wiki-title" style="color:var(--muted);font-weight:400">已读 ${done} / ${total} 篇</div></div>`;
    if (f) {
      let hits = 0;
      ALL.forEach(e => {
        const hay = (e.title + " " + e.category + " " + (e.symptoms || []).join(" ") + " " + e.text).toLowerCase();
        const idx = hay.indexOf(f);
        if (idx === -1) return;
        hits++;
        if (hits > 40) return;
        const at = Math.max(0, idx - 30);
        const snip = esc(e.text.slice(at, at + 80)).replace(new RegExp(f.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "i"), m => `<mark>${m}</mark>`);
        html += `<a class="search-hit" href="#/${e.wiki}/${e.id}"><b>${esc(e.title)}</b> <span style="color:var(--muted)">· ${e.wikiName}</span><div class="snippet">${snip}…</div></a>`;
      });
      nav.innerHTML = html + (hits === 0 ? '<div class="empty">无匹配结果</div>' : "");
      return;
    }
    PORTAL_DATA.wikis.forEach(w => {
      html += `<div class="wiki-block"><div class="wiki-title"><span class="dot" style="background:${w.id === "wiki" ? "var(--wiki)" : "var(--pb)"}"></span>${w.name} · ${w.desc}</div>`;
      const cats = [...new Set(w.entries.map(e => e.category))];
      cats.forEach(cat => {
        html += `<div class="cat-title">${cat}</div>`;
        w.entries.filter(e => e.category === cat).forEach(e => {
          html += `<a class="nav-entry" data-key="${w.id}/${e.id}" href="#/${w.id}/${e.id}"><span class="t">${esc(e.title)}</span>${mark(e) ? '<span class="read">✓</span>' : ""}</a>`;
        });
      });
      html += "</div>";
    });
    nav.innerHTML = html;
  }

  // ===== 视图 =====
  function showHome() {
    $("crumb").innerHTML = "首页";
    const total = ALL.length, done = ALL.filter(mark).length;
    $("view").innerHTML = `
      <div class="home-hero">
        <h2>👋 欢迎开始系统学习</h2>
        <p>这里合并了 <b>Web 漏洞教科书</b>（是什么、为什么、怎么修）与 <b>实战手册</b>（怎么打、打不动怎么办）。
        建议：<b>教科书打底 → 靶场动手 → 手册解题 → 知识卡自测</b>。所有内容仅用于授权安全测试与防御学习。</p>
        <div class="stat-row">
          <div class="stat"><div class="n">${PORTAL_DATA.wikis[0].entries.length}</div><div class="l">教科书条目</div></div>
          <div class="stat"><div class="n">${(PORTAL_DATA.wikis[1] || { entries: [] }).entries.length}</div><div class="l">实战条目</div></div>
          <div class="stat"><div class="n">${PORTAL_DATA.cardCount}</div><div class="l">知识卡</div></div>
          <div class="stat"><div class="n">${done}/${total}</div><div class="l">已读进度</div></div>
        </div>
      </div>
      <div class="home-grid">
        <div class="home-card" onclick="location.hash='#/wiki/sql-injection'">
          <h3>① 从 SQL 注入开始（打样条目）</h3><p>最能代表「注入家族」的条目：一个根因（数据与代码未分离），五种盲打形态。读完它，NoSQL/命令注入/SSTI 都是换皮。</p><span class="go">开始阅读 →</span>
        </div>
        <div class="home-card" onclick="location.hash='#/playbook/practice-labs'">
          <h3>② 搭一个本地靶场（30 分钟）</h3><p>PortSwigger Labs 免费即开；DVWA/Juice-Shop 本机跑起来。学了立刻练，练完对照「impossible 等级」看修复长什么样。</p><span class="go">搭建指南 →</span>
        </div>
        <div class="home-card" onclick="location.hash='#/wiki/owasp-top10'">
          <h3>③ 用 OWASP Top 10 当学习地图</h3><p>全部 32 个条目按十大风险类别组织成 checklist——按图索骥，不迷路。</p><span class="go">查看地图 →</span>
        </div>
        <div class="home-card" onclick="location.hash='#/playbook/stuck-playbook'">
          <h3>④ 打不动了？先读卡点五问</h3><p>实战卡壳的 90% 不是技巧问题，是问题没问对。五个诊断问题带你定位卡在哪一层。</p><span class="go">查看方法 →</span>
        </div>
        <div class="home-card" onclick="location.hash='#/playbook/burp-suite'">
          <h3>⑤ 工具实践：从 Burp 开始</h3><p>8 篇工具手册：Burp / sqlmap / ffuf / nuclei / crt.sh / OOB 通道 / JWT 工具链 / 靶场——每篇都有 Windows 安装与命令配方。</p><span class="go">工具箱 →</span>
        </div>
        <div class="home-card" onclick="window.open('../cards/viewer.html')">
          <h3>⑥ 每天 10 分钟知识卡</h3><p>163 张卡，基础/进阶/易错三档难度，支持自测模式与进度记忆——通勤、碎片时间都适用。</p><span class="go">打开卡片 →</span>
        </div>
      </div>`;
  }

  function showEntry(e) {
    $("crumb").innerHTML = `${e.wikiName} <b>›</b> ${e.category} <b>›</b> <b>${esc(e.title)}</b>`;
    let chips = `<span class="chip ${e.wiki === "wiki" ? "c-wiki" : "c-pb"}">${e.wikiName}</span><span class="chip">${e.category}</span>`;
    if (e.severity && e.severity !== "-") chips += `<span class="chip">严重度 ${e.severity}</span>`;
    if (e.owasp && e.owasp !== "-") chips += `<span class="chip">${esc(e.owasp)}</span>`;
    const sym = (e.symptoms || []).length ? `<div class="symptom-box"><b>🎯 什么时候读这篇：</b>${e.symptoms.map(esc).join(" · ")}</div>` : "";
    let extra = "";
    if (e.mapsTo && e.mapsTo !== "-") {
      const m = ALL.find(x => x.path && e.mapsTo.endsWith(x.path)) ||
                ALL.find(x => e.mapsTo.includes(x.path));
      if (m) extra = `<a class="btn" style="text-decoration:none" href="#/${m.wiki}/${m.id}">📖 对应教科书/实战条目：${esc(m.title)}</a>`;
    }
    const idx = ALL.indexOf(e);
    const prev = ALL[idx - 1], next = ALL[idx + 1];
    $("view").innerHTML = `
      <div class="entry-head">${chips}<h1>${esc(e.title)}</h1></div>${sym}
      <div class="md">${e.html}</div>
      ${extra ? `<div style="margin-top:26px">${extra}</div>` : ""}
      <div class="entry-footer">
        <div class="nav-arrows">${prev ? `<button onclick="location.hash='#/${prev.wiki}/${prev.id}'">← ${esc(prev.title).slice(0, 14)}…</button>` : "<span></span>"}
        ${next ? `<button onclick="location.hash='#/${next.wiki}/${next.id}'">${esc(next.title).slice(0, 14)}… →</button>` : "<span></span>"}</div>
        <button class="mark ${mark(e) ? "on" : ""}" id="markBtn">${mark(e) ? "✓ 已读" : "标记为已读"}</button>
      </div>`;
    $("markBtn").onclick = () => {
      const k = e.wiki + "/" + e.id;
      read.has(k) ? read.delete(k) : read.add(k);
      saveRead(); showEntry(e); buildNav($("q").value);
      const done = ALL.filter(mark).length;
      $("pbar").style.width = (done / ALL.length * 100) + "%";
    };
    document.querySelector(".content").scrollTop = 0;
  }

  function route() {
    const h = location.hash.replace(/^#\/?/, "");
    const navEl = $("nav");
    navEl.querySelectorAll(".nav-entry.active").forEach(x => x.classList.remove("active"));
    if (!h || h === "home") { showHome(); return; }
    const e = byKey.get(h);
    if (e) {
      showEntry(e);
      const el = navEl.querySelector(`.nav-entry[data-key="${h}"]`);
      if (el) { el.classList.add("active"); el.scrollIntoView({ block: "nearest" }); }
      $("q").value = ""; buildNav("");
    } else { showHome(); }
  }

  $("q").addEventListener("input", ev => buildNav(ev.target.value));
  $("homeBtn").addEventListener("click", () => location.hash = "#/home");
  window.addEventListener("hashchange", route);

  buildNav("");
  route();
})();
</script>
</body>
</html>
